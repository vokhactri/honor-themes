[project]
name = "honor-themes"
version = "2.1.3"
description = "Dark Flat and Liquid Glass icon themes for Honor phones"
requires-python = ">=3.14"
# Pinned to the versions that rendered the approved icons. Newer releases can shift resampling and colors.
dependencies = [
    "av==19.0.1",
    "lz4==4.4.5",
    "numpy==2.5.4",
    "pillow==12.3.0",
    "resvg-py==0.5.0",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
    "scipy-stubs>=1.18.1.1",
]

[tool.basedpyright]
# build/ holds scratch scripts that are not part of the source
include = ["theme", "scripts"]
# pyright's default checks; basedpyright's "recommended" adds many more
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
